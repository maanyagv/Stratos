# STRATOS: Motorsport Race Strategy AI Default Configuration
project:
  name: "stratos"
  version: "0.1.0"
  description: "Risk-aware deliberative multi-agent decision-making for race strategy."
  seed: 42

data:
  # Path configuration relative to repository root
  data_dir: "data"
  cache_dir: "data/cache"
  raw_dir: "data/raw"
  processed_dir: "data/processed"

  # FastF1 default parameters
  default_season: 2023
  default_event: "Monaco"
  default_session: "R"

  # FastF1 loader options
  cache_enabled: true
  load_laps: true
  load_telemetry: false
  load_weather: true
  load_messages: true

logging:
  level: "INFO"
  format: "%(asctime)s - [%(levelname)s] - %(name)s - %(message)s"

models:
  tyre:
    fuel_correction_per_lap: 0.033
    default_track_temp: 35.0
    compounds:
      SOFT:
        base_delta: 0.00
        linear_deg: 0.085
        cliff_threshold: 18
      MEDIUM:
        base_delta: 0.55
        linear_deg: 0.045
        cliff_threshold: 28
      HARD:
        base_delta: 1.15
        linear_deg: 0.022
        cliff_threshold: 44

  pit:
    typical_stationary_time: 2.4
    front_wing_change_time: 8.0
    vsc_saving_ratio: 0.42
    sc_saving_ratio: 0.52

  kinematics:
    dirty_air_threshold_seconds: 1.5
    dirty_air_penalty_seconds: 0.65
    dirty_air_deg_multiplier: 1.25
    rubber_evolution_per_lap: 0.015

